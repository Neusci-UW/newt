[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "neusci-daq-visualizer"
version = "0.1.0"
description = "Newt: the Neuroscience Educational Workflow Toolbox"
requires-python = ">=3.11"
dependencies = ["numpy", "scipy", "pyqtgraph>=0.13", "PyQt6", "h5py"]

[project.urls]
Source = "https://github.com/Neusci-UW/newt"

[project.optional-dependencies]
nidaqmx = ["nidaqmx>=1.0"]
multichannelio = ["PyDAQmx"]
audio = ["sounddevice>=0.4"]
web = ["PyQt6-WebEngine"]   # the Membrane potential tab
dev = ["pytest", "neuscitk", "scikit-learn", "matplotlib"]

[project.scripts]
newt = "neusci_daq.__main__:main"
neusci-daq = "neusci_daq.__main__:main"      # the old command, still works

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
neusci_daq = ["icons/*.png", "icons/*.ico", "icons/*.svg", "web/*.html", "web/*.js", "lessons/*.js", "web/vendor/mathjax/*.js"]
