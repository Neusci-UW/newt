# Copy and edit per rig. Find the device name with:  python -m neusci_daq --list-devices
[device]
backend = "nidaqmx"        # "nidaqmx" (hardware-timed) | "multichannelio" (software-polled) | "simulated"
device = "Dev1"
sample_rate = 20000        # Hz PER CHANNEL. channels x rate must be <= 100000 on a USB-6003 (5 channels at 20 kHz).
chunk_size = 1000          # samples/channel per read -> 50 ms display latency here
terminal_config = "DIFF"    # "RSE" (ai0-ai7) or "DIFF" (ai0-ai3, using ai4-ai7 as negatives)

[display]
window_s = 10

[recording]
directory = "data"

# Stimulator: levels are sent in volts. To set them in the units your stimulus isolator
# delivers instead, give the units and how many of them one volt at the output makes.
# The safety limit (max_voltage) is always in volts.
# [stimulator]
# units = "µA"
# scale = 100        # µA per V, e.g. an isolator set to 100 µA/V

# Only used with --backend simulated: these inputs get noise and spikes but no sine wave.
[simulated]
no_sine = ["ai1"]

# scale/offset convert volts at the DAQ input to your units: value = volts*scale + offset.
# Example: an amplifier with gain 1000, displaying mV at the electrode:
#   scale = 1000 (mV per V) / 1000 (gain) = 1.0, units = "mV"
# Only raw volts are saved; scale/offset are stored as metadata so you can fix them later.
[[channels]]
physical = "ai0"
name = "Ch1"
units = "V"
scale = 1.0

[[channels]]
physical = "ai1"
name = "Ch2"
units = "V"
scale = 1.0
